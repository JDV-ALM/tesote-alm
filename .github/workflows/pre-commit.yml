name: lint

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - '*'

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install linters
        run: |
          pip install ruff black isort
      
      - name: Run linters
        run: |
          # Check but don't fail
          ruff check tesote_connector/ || true
          black --check tesote_connector/ || true
          isort --check-only tesote_connector/ || true
          echo "✅ Linting complete (non-blocking)"