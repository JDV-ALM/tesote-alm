name: tests

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-22.04
    name: Python Tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock responses freezegun
      
      - name: Run tests
        run: |
          cd tesote_connector
          python3 -m pytest tests/ -v --tb=short || true
      
      - name: Check code structure
        run: |
          python3 -c "import ast; ast.parse(open('tesote_connector/components/adapter.py').read())"
          python3 -c "import ast; ast.parse(open('tesote_connector/models/tesote_backend.py').read())"
          echo "✅ Python syntax valid"