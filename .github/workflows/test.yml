name: tests

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-22.04
    name: Python Tests
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Check code structure
        run: |
          uv run python -c "import ast; ast.parse(open('components/adapter.py').read())"
          uv run python -c "import ast; ast.parse(open('models/tesote_backend.py').read())"
          echo "✅ Python syntax valid"
