[pytest]
# Pytest configuration for Tesote Odoo API Connector

# Test paths
testpaths = tesote_connector/tests

# Python paths - add current directory
python_paths = .

# Import mode
import-mode = importlib

# Disable doctest
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:doctest

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    slow: Slow tests

# Coverage settings
[coverage:run]
source = tesote_connector
omit = 
    */tests/*
    */__pycache__/*
    */migrations/*